name: gastro-snapshot

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: life-discovery
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: life-discovery/pnpm-lock.yaml

      - name: Install workspace deps
        run: pnpm install --frozen-lockfile

      - name: Refresh gastro editorial snapshot
        run: node scripts/refresh-gastro-snapshot.mjs

      - name: Validate API source routes compile
        run: pnpm --filter @life/web build

      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/public/data/gastro-editorial.json
          git diff --cached --quiet || git commit -m "chore: atualizar snapshot editorial gastronômico"
          git push
